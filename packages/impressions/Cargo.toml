[package]
name = "impressions"
version = "0.0.0"
description = "An experimental binary analysis library inspired by the City Building series from Impressions Games"
authors = ["Daniel Balcomb <daniel.balcomb@gmail.com>"]
repository = "https://github.com/dbalcomb/impressions"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[dependencies]
array-init = "2.1.0"
bytes = { version = "1.12.1", features = ["serde"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
